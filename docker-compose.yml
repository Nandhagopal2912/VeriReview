services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verireview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-verireview}
      POSTGRES_DB: ${POSTGRES_DB:-verireview}
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      VERIREVIEW_ENVIRONMENT: ${VERIREVIEW_ENVIRONMENT:-development}
      VERIREVIEW_LOG_LEVEL: ${VERIREVIEW_LOG_LEVEL:-INFO}
      VERIREVIEW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-verireview}:${POSTGRES_PASSWORD:-verireview}@db:5432/${POSTGRES_DB:-verireview}
      # Advisory mode (Phase 11): the webhook endpoint refuses every delivery until this is set.
      VERIREVIEW_GITHUB_WEBHOOK_SECRET: ${VERIREVIEW_GITHUB_WEBHOOK_SECRET:-}
      VERIREVIEW_ADVISORY_CHECK_NAME: ${VERIREVIEW_ADVISORY_CHECK_NAME:-VeriReview}
      # Dashboard (Phase 13): off unless a token is set in .env; stored code kept this long.
      VERIREVIEW_DASHBOARD_TOKEN: ${VERIREVIEW_DASHBOARD_TOKEN:-}
      VERIREVIEW_AUDIT_RETENTION_DAYS: ${VERIREVIEW_AUDIT_RETENTION_DAYS:-90}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Advisory worker: only with `docker compose --profile advisory up`. Needs the GitHub App id
  # in .env and the App's private key in the file below (git-ignored, mounted read-only as a
  # Docker secret, never passed as an environment variable).
  worker:
    profiles: ["advisory"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["verireview", "worker"]
    environment:
      VERIREVIEW_ENVIRONMENT: ${VERIREVIEW_ENVIRONMENT:-development}
      VERIREVIEW_LOG_LEVEL: ${VERIREVIEW_LOG_LEVEL:-INFO}
      VERIREVIEW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-verireview}:${POSTGRES_PASSWORD:-verireview}@db:5432/${POSTGRES_DB:-verireview}
      VERIREVIEW_GITHUB_APP_ID: ${VERIREVIEW_GITHUB_APP_ID:-}
      VERIREVIEW_GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_key
      VERIREVIEW_ADVISORY_CHECK_NAME: ${VERIREVIEW_ADVISORY_CHECK_NAME:-VeriReview}
      VERIREVIEW_POLICY_MODE: ${VERIREVIEW_POLICY_MODE:-advisory}
      # Phase 12: stays false; see docs/phase12_staged_enforcement.md (nothing is eligible).
      VERIREVIEW_POLICY_ALLOW_BLOCK: ${VERIREVIEW_POLICY_ALLOW_BLOCK:-false}
    secrets:
      - github_app_key
    depends_on:
      api:
        condition: service_healthy  # the api container applies the migrations

secrets:
  github_app_key:
    file: ${VERIREVIEW_GITHUB_APP_PRIVATE_KEY_FILE:-./secrets/github-app.pem}

volumes:
  pgdata:
