<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 270" width="380" height="270" font-family="'Times New Roman', Times, serif" role="img" aria-labelledby="t d">
<title id="t">Evaluation protocol of each round</title>
<desc id="d">Five steps repeated in each of three rounds: freeze a new test set by hash; change rules on development data only; pre-register the protocol; run the test set once with old and new rules on the same cases; retire the test set to development data, then start the next round.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect width="380" height="270" fill="#ffffff"/>
<rect x="48" y="8" width="324" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text x="58" y="26" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000000">1  Freeze a new test set</text>
<text x="58" y="42" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#3d3d3d">cases and labels pinned by a hash</text>
<line x1="210" y1="50" x2="210" y2="61" stroke="#000000" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="48" y="61" width="324" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text x="58" y="79" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000000">2  Change rules on development data only</text>
<text x="58" y="95" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#3d3d3d">the test set is never run or inspected</text>
<line x1="210" y1="103" x2="210" y2="114" stroke="#000000" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="48" y="114" width="324" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text x="58" y="132" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000000">3  Pre-register the protocol</text>
<text x="58" y="148" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#3d3d3d">systems, metrics, questions; hash recorded</text>
<line x1="210" y1="156" x2="210" y2="167" stroke="#000000" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="48" y="167" width="324" height="42" fill="#ececec" stroke="#000000" stroke-width="1.4"/>
<text x="58" y="185" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000000">4  Run once: old rules vs new rules</text>
<text x="58" y="201" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#3d3d3d">same cases, paired bootstrap, 95% CI</text>
<line x1="210" y1="209" x2="210" y2="220" stroke="#000000" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="48" y="220" width="324" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text x="58" y="238" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="start" fill="#000000">5  Retire the test set</text>
<text x="58" y="254" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#3d3d3d">it becomes development data</text>
<polyline points="48,241 26,241 26,29" fill="none" stroke="#000000" stroke-width="1.4"/>
<line x1="26" y1="29" x2="48" y2="29" stroke="#000000" stroke-width="1.4" marker-end="url(#head)"/>
<text x="19" y="135" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000000" transform="rotate(-90 19 135)">next round</text>
</svg>
