<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 290" width="380" height="290" font-family="'Times New Roman', Times, serif" role="img" aria-labelledby="t d">
<title id="t">False acceptance against false blocking, round-3 blind test</title>
<desc id="d">Each system's false-acceptance rate (bad fixes accepted) against its false-blocking rate (good fixes rejected) on 148 blind test cases. Change-location, code-model, structural and requirement baselines accept 61 to 98 percent of bad fixes; lexical and embedding baselines reject 89 to 93 percent of good fixes; VeriReview's rules are low on both, at 8.8 and 11.1 percent.</desc>
