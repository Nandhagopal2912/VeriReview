[project]
name = "verireview"
version = "0.1.0"
description = "Evidence-based verification of GitHub pull-request review resolution."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx2>=2.13.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
verireview = "verireview.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verireview"]

# --- Ruff ------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "N",       # pep8-naming
    "S",       # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works
"migrations/**" = ["N999"]

# --- mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["verireview"]

# --- pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]          # shared test helpers: `from helpers.github import ...`
norecursedirs = ["fixtures"]    # fixture code (e.g. a fake repo's test_*.py) is data, not tests
addopts = "--import-mode=importlib -m 'not integration'"
markers = [
    "integration: needs a running PostgreSQL (run with: uv run pytest -m integration)",
]

[tool.coverage.run]
source = ["verireview"]
branch = true
